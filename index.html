<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DateBloom 🌸</title>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe4ef, #fff7fb);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #4b2635;
}

.card {
  width: min(90%, 430px);
  padding: 35px 25px;
  text-align: center;
  background: rgba(255,255,255,.9);
  border-radius: 30px;
  box-shadow: 0 20px 60px rgba(180,80,120,.2);
  position: relative;
  z-index: 5;
}

.flower {
  position: fixed;
  font-size: 35px;
  animation: float 6s infinite ease-in-out;
  opacity: .8;
}

.f1 { top: 8%; left: 8%; }
.f2 { top: 15%; right: 8%; animation-delay: 1s; }
.f3 { bottom: 10%; left: 10%; animation-delay: 2s; }
.f4 { bottom: 15%; right: 10%; animation-delay: 3s; }

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}

h1 {
  color: #e94f87;
  font-size: 30px;
  margin-bottom: 12px;
}

p {
  line-height: 1.6;
}

.buttons {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 18px;
}

button {
  border: 0;
  border-radius: 50px;
  padding: 15px 28px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yes {

  color: white;
  box-shadow: 0 8px 20px rgba(237,79,135,.3);
}

#no {
  background: #eeeeee;
  color: #555;
  transition: .25s ease;
}
