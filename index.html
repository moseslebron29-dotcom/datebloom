<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DateBloom 🌸</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, #ffd1e5 0%, transparent 30%),
    radial-gradient(circle at 80% 80%, #d9c7ff 0%, transparent 35%),
    linear-gradient(135deg, #ffedf5, #f5efff);
  color: #432536;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 35px 25px;
  text-align: center;
  border-radius: 32px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(18px);
  box-shadow: 0 25px 70px rgba(100,50,100,0.18);
  border: 1px solid rgba(255,255,255,0.8);
  animation: appear 0.7s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.logo {
  font-size: 64px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

h1 {
  margin: 15px 0 10px;
  font-size: 30px;
  color: #d83f78;
}

.subtitle {
  color: #765466;
  line-height: 1.6;
  font-size: 16px;
}

.buttons {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 12px;
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}

#yes {
  color: white;
  background: linear-gradient(135deg, #ed4f91, #c93472);
  box-shadow: 0 10px 25px rgba(220,60,120,0.25);
}

#yes:hover {
  transform: translateY(-3px) scale(1.04);
}

#no {
  background: white;
  color: #777;
}

.field {
  text-align: left;
  margin-top: 20px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #5d3448;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #f1c4d6;
  border-radius: 16px;
  font-size: 16px;
  outline: none;
  background: rgba(255,255,255,0.9);
}

input:focus {
  border-color: #dd4c83;
}

#dateScreen,
#successScreen {
  display: none;
}

.confirm {
  width: 100%;
  margin-top: 25px;
  color: white;
  background: linear-gradient(135deg, #ed4f91, #c93472);
}

.small {
  margin-top: 22px;
  color: #9b7d8c;
  font-size: 13px;
}

.flower {
  position: fixed;
  font-size: 28px;
  opacity: 0.65;
  animation: drift 7s infinite ease-in-out;
  pointer-events: none;
}

.f1 { top: 8%; left: 8%; }
.f2 { top: 18%; right: 8%; animation-delay: 1s; }
.f3 { bottom: 12%; left: 7%; animation-delay: 2s; }
.f4 { bottom: 18%; right: 8%; animation-delay: 3s; }
.f5 { top: 50%; left: 3%; animation-delay: 4s; }
.f6 { top: 55%; right: 3%; animation-delay: 5s; }

@keyframes drift {
  0%,100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-18px) rotate(10deg);
  }
}

.heart {
  font-size: 60px;
  animation: heartbeat 1.4s infinite;
}

@keyframes heartbeat {
  0%,100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.12);
  }
}
</style>
</head>

<body>

<!-- Floating decorations -->
<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌹</div>
<div class="flower f5">✨</div>
<div class="flower f6">💮</div>


<div class="container">

  <!-- FIRST SCREEN -->
  <div class="card" id="mainScreen">

    <div class="logo">🌸</div>

    <h1>DateBloom</h1>

    <p class="subtitle">
      A little question for you... 💗
      <br><br>
      Would you like to spend some time together?
    </p>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">NO 😭</button>
    </div>

    <p class="small">
      Choose carefully 🌷
    </p>

  </div>


  <!-- DATE & TIME SCREEN -->
  <div class="card" id="dateScreen">

    <div class="logo">💐</div>

    <h1>Let's plan it!</h1>

    <p class="subtitle">
      Pick a date and time that works for you. ✨
    </p>

    <div class="field">
      <label for="date">📅 Choose a date</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label for="time">🕐 Choose a time</label>
      <input type="time" id="time">
    </div>

    <button class="confirm" id="confirm">
      Confirm 💖
    </button>

    <p class="small">
      Your choices will appear on the confirmation screen.
    </p>

  </div>


  <!-- SUCCESS SCREEN -->
  <div class="card" id="successScreen">

    <div class="heart">💖</div>

    <h1>It's a date! 🎉</h1>

    <p class="subtitle">
      Everything is set.
    </p>

    <p id="result"></p>

    <p class="small">
      🌸 DateBloom 🌸
    </p>

  </div>

</div>


<script>

const mainScreen = document.getElementById("mainScreen");
const dateScreen = document.getElementById("dateScreen");
const successScreen = document.getElementById("successScreen");

const yesButton = document.getElementById("yes");
const noButton = document.getElementById("no");
const confirmButton = document.getElementById("confirm");


// YES BUTTON
yesButton.addEventListener("click", function() {

  mainScreen.style.display = "none";
  dateScreen.style.display = "block";

});


// NO BUTTON MOVES
function moveNoButton() {

  const maxX = window.innerWidth - noButton.offsetWidth - 20;
  const maxY = window.innerHeight - noButton.offsetHeight - 20;

  noButton.style.position = "fixed";

  noButton.style.left =
    Math.max(10, Math.random() * maxX) + "px";

  noButton.style.top =
    Math.max(10, Math.random() * maxY) + "px";
}

noButton.addEventListener("mouseenter", moveNoButton);

noButton.addEventListener("touchstart", function(event) {
  event.preventDefault();
  moveNoButton();
});

noButton.addEventListener("click", function(event) {
  event.preventDefault();
  moveNoButton();
});


// CONFIRM BUTTON
confirmButton.addEventListener("click", function() {

  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  if (!date || !time) {

    alert("Please choose both a date and a time 🌸");
    return;

  }

  const selectedDate = new Date(date + "T00:00:00");

  const formattedDate = selectedDate.toLocaleDateString(
    "en-US",
    {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

  mainScreen.style.display = "none";
  dateScreen.style.display = "none";
  successScreen.style.display = "block";

  document.getElementById("result").innerHTML =
    "📅 <b>" + formattedDate + "</b><br><br>" +
    "🕐 <b>" + time + "</b>";

});

</script>

</body>
</html>
